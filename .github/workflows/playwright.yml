name: E2E tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

  smoke:
    name: Smoke (Chromium)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics-${{ github.run_id }}
          path: |
            allure-results/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  api:
    name: API contract tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test:api

  regression:
    name: Regression (${{ github.event_name == 'schedule' && 'all browsers' || 'Chromium' }})
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium
      - name: Install all browsers
        if: github.event_name == 'schedule'
        run: npx playwright install --with-deps
      - name: Run regression
        run: ${{ github.event_name == 'schedule' && 'npm run test:regression' || 'npm run test:regression:chromium' }}
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  publish-allure:
    name: Publish Allure report
    needs: regression
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && needs.regression.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Download current Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results
      - name: Retrieve prior Allure history
        id: previous-pages
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-pages
      - name: Restore prior history
        if: steps.previous-pages.outcome == 'success'
        run: |
          if [ -d previous-pages/history ]; then
            cp -R previous-pages/history allure-results/history
          fi
      - name: Generate Allure report
        run: npm run allure:generate
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
